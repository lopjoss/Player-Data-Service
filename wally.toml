[package]
name = "lopjoss/player-data-service"
description = "A typed, easy to use player data management library for Roblox with automatic & real time client replication"
version = "1.0.0"
license = "MIT"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
include = [
    "src",
    "src/**",
    "default.project.json",
    "wally.toml",
]
exclude = [
    "**"
]

[server-dependencies]
ProfileStore = "lm-loleris/profilestore@1.0.3"
Signal = "lopjoss/signal@1.0.0"
Replica = "lopjoss/replica-wrapper@1.1.3"